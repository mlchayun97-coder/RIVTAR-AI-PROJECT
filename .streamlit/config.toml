
[server]
# Serve app/static (self-hosted fonts and event photos) at /app/static/...
enableStaticServing = true

[client]
toolbarMode = "minimal"
showSidebarNavigation = false

[browser]
gatherUsageStats = false

[theme]
# Site palette: black, off-white text (see app/theme.py)
base = "dark"
primaryColor = "#EDE8E0"
backgroundColor = "#000000"
secondaryBackgroundColor = "#141312"
textColor = "#EDE8E0"
linkColor = "#EDE8E0"
font = "Jost, Heebo, 'Segoe UI', Arial, sans-serif"
